<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography by Phuwadech Klinklay.">

  <title>Phuterest · Photography by Phu</title>

  <link rel="icon" href="images/phuterest.jpg">

  <style>
    :root {
      --background: #ffffff;
      --text: #202020;
      --muted: #737373;
      --border: #e9e9e9;
      --sidebar-width: 100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button,
    a {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 115px;
      z-index: 100;
      padding: 12px 18px;
      background: #ffffff;
    }

    .skip-link:focus {
      top: 12px;
    }

    /* Desktop sidebar */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: var(--sidebar-width);
      padding: 22px 6px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: #ffffff;
    }

    .sidebar-logo {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 50%;
    }

    .sidebar-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-fallback {
      color: var(--text);
      font-size: 28px;
      font-weight: 700;
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      gap: 7px;
      width: 86px;
      min-height: 70px;
      padding: 4px 0;
    }

    /* Original project logos displayed in black and white */

    .nav-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 47px;
      height: 47px;
      padding: 7px;
      border-radius: 50%;
      background: #f4f4f2;
      transition: background 0.2s ease;
    }

    .nav-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      filter: grayscale(100%);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .nav-link:hover .nav-icon {
      background: #e9e9e6;
    }

    .nav-link.active .nav-icon {
      background: #f4f4f2;
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    /* Main page */

    .page {
      margin-left: var(--sidebar-width);
      padding: 0 30px 35px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 0;
      background: rgba(255, 255, 255, 0.97);
    }

    .search-box {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 12px;
      min-width: 0;
      height: 54px;
      padding: 0 20px;
      border-radius: 30px;
      background: #f0f0ee;
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: none;
      stroke: #656560;
      stroke-width: 1.7;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }

    .search-box:focus-within {
      box-shadow: 0 0 0 3px #d5d5d5;
    }

    .search-box input:focus-visible {
      outline: none;
    }

    .back-link {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Page heading */

    .intro {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 25px 0 24px;
    }

    .intro-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 50%;
    }

    .intro h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -1.1px;
    }

    .credit {
      margin: 0 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    main {
      min-height: 50vh;
    }

    .gallery-meta {
      display: flex;
      justify-content: flex-end;
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }

    .photo-count {
      color: var(--muted);
      font-size: 12px;
    }

    /* Masonry gallery */

    .gallery {
      columns: 5;
      column-gap: 20px;
    }

    .photo-card {
      break-inside: avoid;
      margin: 0 0 23px;
    }

    .photo-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 19px;
      background: #f1f0ed;
      text-align: left;
    }

    .photo-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    .photo-button::after {
      content: "View photo ↗";
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 10px 13px;
      border-radius: 24px;
      background: #ffffff;
      color: #222222;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .photo-button:hover::after,
    .photo-button:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-button:hover img {
      filter: brightness(0.95);
    }

    .photo-caption {
      padding: 11px 5px 0;
    }

    .photo-caption h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .missing-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 220px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .missing-photo strong {
      font-size: 14px;
      font-weight: 500;
    }

    .missing-photo small {
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
    }

    /* Centred footer */

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 0 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    /* Full-size photo viewer */

    .viewer {
      width: min(1100px, 94vw);
      max-height: 94dvh;
      padding: 0;
      overflow: auto;
      border: 0;
      border-radius: 20px;
      background: #151515;
      color: #ffffff;
    }

    .viewer::backdrop {
      background: rgba(0, 0, 0, 0.85);
    }

    .viewer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
    }

    .viewer-position {
      margin: 0;
      color: #cccccc;
      font-size: 12px;
    }

    .viewer-button {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #303030;
      color: #ffffff;
      font-size: 24px;
    }

    .viewer-button:hover {
      background: #444444;
    }

    .viewer-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .viewer-image {
      display: block;
      width: 100%;
      height: min(70dvh, 850px);
      object-fit: contain;
    }

    .viewer-error {
      padding: 80px 25px;
      color: #cccccc;
      text-align: center;
    }

    .viewer-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px 22px;
    }

    .viewer-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .viewer-controls {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
    }

    /* Responsive layout */

    @media (min-width: 1800px) {
      .gallery {
        columns: 6;
      }
    }

    @media (max-width: 1250px) {
      .gallery {
        columns: 4;
      }
    }

    @media (max-width: 1000px) {
      .gallery {
        columns: 3;
      }

      .page {
        padding-inline: 22px;
      }

      .credit {
        display: none;
      }
    }

    @media (max-width: 700px) {
      /* Sidebar becomes bottom navigation */

      .sidebar {
        inset: auto 0 0;
        flex-direction: row;
        justify-content: space-around;
        gap: 0;
        width: 100%;
        padding: 5px 4px calc(5px + env(safe-area-inset-bottom));
        overflow: visible;
        border-top: 1px solid var(--border);
        border-right: 0;
      }

      .sidebar-logo {
        display: none;
      }

      .nav-link {
        gap: 4px;
        width: 20%;
        max-width: 90px;
        min-height: 58px;
        padding: 4px 1px;
      }

      .nav-icon {
        width: 36px;
        height: 36px;
        padding: 5px;
      }

      .nav-label {
        font-size: 9px;
      }

      .page {
        margin-left: 0;
        padding: 0 14px calc(96px + env(safe-area-inset-bottom));
      }

      .skip-link {
        left: 14px;
      }

      .topbar {
        gap: 10px;
        padding: calc(12px + env(safe-area-inset-top)) 0 12px;
      }

      .search-box {
        height: 46px;
        padding-inline: 13px;
      }

      .search-box input {
        font-size: 16px;
      }

      .back-link {
        font-size: 11px;
      }

      .intro {
        gap: 12px;
        padding: 20px 0;
      }

      .intro-logo {
        width: 55px;
        height: 55px;
      }

      .intro h1 {
        font-size: 25px;
      }

      .gallery-meta {
        padding: 10px 0 15px;
      }

      .gallery {
        columns: 2;
        column-gap: 12px;
      }

      .photo-card {
        margin-bottom: 18px;
      }

      .photo-button {
        border-radius: 13px;
      }

      .photo-button::after {
        display: none;
      }

      .photo-caption {
        padding: 9px 2px 0;
      }

      .photo-caption h2 {
        font-size: 12px;
      }

      .missing-photo {
        min-height: 160px;
        padding: 15px;
      }

      .viewer-image {
        height: 60dvh;
      }

      .viewer-details {
        gap: 12px;
        padding: 16px;
      }

      .viewer-title {
        font-size: 15px;
      }
    }

    @media (max-width: 380px) {
      .back-link {
        display: none;
      }
    }

    @media (max-width: 359px) {
      .gallery {
        columns: 1;
      }

      .nav-label {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to photographs</a>

  <nav class="sidebar" aria-label="Portfolio pages">
    <a
      class="sidebar-logo"
      href="phuterest.html"
      aria-label="Phuterest home"
    >
      <img src="images/phuterest.jpg" alt="">
      <span class="logo-fallback" hidden>P</span>
    </a>

    <a class="nav-link" href="index.html">
      <span class="nav-icon">
        <img src="images/icon-phubook.png" alt="">
      </span>
      <span class="nav-label">Phubook</span>
    </a>

    <a class="nav-link" href="phustagram.html">
      <span class="nav-icon">
        <img src="images/icon-phustagram.png" alt="">
      </span>
      <span class="nav-label">Phustagram</span>
    </a>

    <a class="nav-link" href="phutube.html">
      <span class="nav-icon">
        <img src="images/icon-phutube.png" alt="">
      </span>
      <span class="nav-label">PhuTube</span>
    </a>

    <a class="nav-link" href="phugleads.html">
      <span class="nav-icon">
        <img src="images/icon-phugleads.png" alt="">
      </span>
      <span class="nav-label">Phugle Ads</span>
    </a>

    <a
      class="nav-link active"
      href="phuterest.html"
      aria-current="page"
    >
      <span class="nav-icon">
        <img src="images/phuterest.jpg" alt="">
      </span>
      <span class="nav-label">Phuterest</span>
    </a>
  </nav>

  <div class="page">
    <header class="topbar">
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7.5"/>
          <path d="m16 16 5 5"/>
        </svg>

        <input
          id="search"
          type="search"
          placeholder="Search photography"
          aria-label="Search photographs"
          autocomplete="off"
        >
      </label>

      <a class="back-link" href="index.html">← Phubook</a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <img
        class="intro-logo"
        src="images/phuterest.jpg"
        alt="Phuterest logo"
      >

      <h1 id="page-title">Phuterest</h1>

      <p class="credit">Photography by Phu</p>
    </section>

    <main id="main">
      <div class="gallery-meta">
        <span
          class="photo-count"
          id="photo-count"
          aria-live="polite"
        ></span>
      </div>

      <div class="gallery" id="gallery"></div>

      <p class="empty-state" id="empty-state" hidden>
        No photographs found. Try another keyword.
      </p>

      <noscript>
        <p>Please enable JavaScript to view the photography gallery.</p>
      </noscript>
    </main>

    <footer>© 2026 Phuwadech Klinklay</footer>
  </div>

  <dialog
    class="viewer"
    id="viewer"
    aria-labelledby="viewer-title"
  >
    <div class="viewer-top">
      <p class="viewer-position" id="viewer-position"></p>

      <button
        class="viewer-button"
        id="close-viewer"
        type="button"
        aria-label="Close photograph"
        autofocus
      >×</button>
    </div>

    <img
      class="viewer-image"
      id="viewer-image"
      alt=""
    >

    <p class="viewer-error" id="viewer-error" hidden>
      This photograph could not be loaded.
    </p>

    <div class="viewer-details">
      <h2 class="viewer-title" id="viewer-title"></h2>

      <div class="viewer-controls">
        <button
          class="viewer-button"
          id="previous-photo"
          type="button"
          aria-label="Previous photograph"
        >‹</button>

        <button
          class="viewer-button"
          id="next-photo"
          type="button"
          aria-label="Next photograph"
        >›</button>
      </div>
    </div>
  </dialog>

  <script>
    "use strict";

    /*
      Logo: images/phuterest.jpg
      Photographs: images/ptr1.jpg through images/ptr11.jpg

      Edit titles below whenever needed.
      Add an alt property for a more detailed image description.
      Photographs retain their original proportions and colours.
    */

    const photos = [
      {
        src: "images/ptr1.jpg",
        title: "The Fire Show"
      },
      {
        src: "images/ptr2.jpg",
        title: "drift"
      },
      {
        src: "images/ptr3.jpg",
        title: "The Red Coral Lounge"
      },
      {
        src: "images/ptr4.jpg",
        title: "faith"
      },
      {
        src: "images/ptr5.jpg",
        title: "Shrine"
      },
      {
        src: "images/ptr6.jpg",
        title: "The Autograph Moment"
      },
      {
        src: "images/ptr7.jpg",
        title: "rythm"
      },
      {
        src: "images/ptr8.jpg",
        title: "Pinto 1"
      },
      {
        src: "images/ptr9.jpg",
        title: "Pinto 2"
      },
      {
        src: "images/ptr10.jpg",
        title: "Pinto 3"
      },
      {
        src: "images/ptr11.jpg",
        title: "Pinto 4"
      }
    ];

    const gallery = document.getElementById("gallery");
    const search = document.getElementById("search");
    const photoCount = document.getElementById("photo-count");
    const emptyState = document.getElementById("empty-state");

    const viewer = document.getElementById("viewer");
    const viewerImage = document.getElementById("viewer-image");
    const viewerTitle = document.getElementById("viewer-title");
    const viewerPosition = document.getElementById("viewer-position");
    const viewerError = document.getElementById("viewer-error");

    const closeButton = document.getElementById("close-viewer");
    const previousButton = document.getElementById("previous-photo");
    const nextButton = document.getElementById("next-photo");

    let visiblePhotos = [];
    let currentIndex = 0;
    let opener = null;
    let previousOverflow = "";

    function getAlt(photo) {
      return photo.alt ||
        photo.title + " — Photography by Phuwadech Klinklay";
    }

    function renderGallery() {
      const query = search.value.trim().toLowerCase();

      visiblePhotos = photos.filter(photo => {
        const searchableText = [
          photo.title,
          photo.alt || ""
        ].join(" ").toLowerCase();

        return searchableText.includes(query);
      });

      gallery.replaceChildren();

      photoCount.textContent =
        visiblePhotos.length +
        (visiblePhotos.length === 1 ? " photograph" : " photographs");

      emptyState.hidden = visiblePhotos.length > 0;

      visiblePhotos.forEach((photo, index) => {
        const card = document.createElement("article");
        card.className = "photo-card";

        const button = document.createElement("button");
        button.className = "photo-button";
        button.type = "button";
        button.setAttribute("aria-label", "View " + photo.title);

        const image = document.createElement("img");
        image.alt = getAlt(photo);
        image.loading = index < 6 ? "eager" : "lazy";
        image.decoding = "async";

        image.addEventListener("error", () => {
          image.hidden = true;

          const placeholder = document.createElement("span");
          placeholder.className = "missing-photo";

          const label = document.createElement("strong");
          label.textContent = "Photograph unavailable";

          const filename = document.createElement("small");
          filename.textContent = photo.src;

          placeholder.append(label, filename);
          button.append(placeholder);
        }, { once: true });

        image.src = photo.src;
        button.append(image);

        button.addEventListener("click", () => {
          openViewer(index, button);
        });

        const caption = document.createElement("div");
        caption.className = "photo-caption";

        const title = document.createElement("h2");
        title.textContent = photo.title;

        caption.append(title);
        card.append(button, caption);
        gallery.append(card);
      });
    }

    function openViewer(index, trigger) {
      currentIndex = index;
      opener = trigger;

      updateViewer();

      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";

      viewer.showModal();
    }

    function updateViewer() {
      const photo = visiblePhotos[currentIndex];

      if (!photo) return;

      viewerImage.hidden = false;
      viewerError.hidden = true;

      viewerImage.alt = getAlt(photo);
      viewerImage.src = photo.full || photo.src;

      viewerTitle.textContent = photo.title;

      viewerPosition.textContent =
        (currentIndex + 1) + " / " + visiblePhotos.length;

      previousButton.disabled = visiblePhotos.length < 2;
      nextButton.disabled = visiblePhotos.length < 2;
    }

    function movePhoto(direction) {
      if (!visiblePhotos.length) return;

      currentIndex =
        (currentIndex + direction + visiblePhotos.length) %
        visiblePhotos.length;

      updateViewer();
    }

    search.addEventListener("input", renderGallery);

    closeButton.addEventListener("click", () => {
      viewer.close();
    });

    previousButton.addEventListener("click", () => {
      movePhoto(-1);
    });

    nextButton.addEventListener("click", () => {
      movePhoto(1);
    });

    viewerImage.addEventListener("error", () => {
      viewerImage.hidden = true;
      viewerError.hidden = false;
    });

    viewerImage.addEventListener("load", () => {
      viewerImage.hidden = false;
      viewerError.hidden = true;
    });

    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        movePhoto(-1);
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        movePhoto(1);
      }
    });

    /* Close when clicking outside the viewer. */

    viewer.addEventListener("click", event => {
      if (event.target !== viewer) return;

      const rect = viewer.getBoundingClientRect();

      const clickedOutside =
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom;

      if (clickedOutside) {
        viewer.close();
      }
    });

    viewer.addEventListener("close", () => {
      document.body.style.overflow = previousOverflow;

      if (opener && opener.isConnected) {
        opener.focus();
      }
    });

    /* Hide missing logos; navigation labels remain visible. */

    document
      .querySelectorAll(".sidebar img, .intro-logo")
      .forEach(image => {
        const showFallback = () => {
          image.hidden = true;

          const fallback = image.nextElementSibling;

          if (
            fallback &&
            fallback.classList.contains("logo-fallback")
          ) {
            fallback.hidden = false;
          }
        };

        image.addEventListener("error", showFallback);

        if (image.complete && image.naturalWidth === 0) {
          showFallback();
        }
      });

    renderGallery();
  </script>
</body>
</html>
