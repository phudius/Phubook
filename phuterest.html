<style>
:root{--ink:#202020;--muted:#737373;--red:#bd142a;--line:#e9e9e9;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,a{-webkit-tap-highlight-color:transparent}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:4px}[hidden]{display:none!important}
.skip{position:fixed;top:-80px;left:90px;background:white;padding:15px;z-index:20}.skip:focus{top:10px}
.rail{position:fixed;inset:0 auto 0 0;width:80px;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:28px;padding:24px 10px;background:white;z-index:5}.rail a{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}.rail a:hover{background:#f1f1f1}.rail .mark{padding:3px}.mark img{width:100%;height:100%;object-fit:contain;border-radius:50%}.monogram{font-size:25px;font-weight:bold;color:var(--red)}.rail svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rail .active{background:#f1f1f1}.rail .rail-bottom{margin-top:auto;font-size:12px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:2px}
.shell{margin-left:80px;padding:0 30px 35px}.topbar{position:sticky;top:0;background:rgba(255,255,255,.97);z-index:4;display:flex;align-items:center;gap:20px;padding:18px 0}.search{display:flex;align-items:center;gap:12px;background:#f0f0ee;border-radius:30px;flex:1;padding:0 20px;min-width:0;height:54px}.search svg{width:20px;min-width:20px;fill:none;stroke:#656560;stroke-width:1.7}.search input{width:100%;border:0;background:transparent;outline:none;min-width:0;color:var(--ink);font-size:16px}.search:focus-within{box-shadow:0 0 0 3px #e1b4bb}.search input:focus-visible{outline:0}.back{font-size:13px;font-weight:600;white-space:nowrap}.back:hover{color:var(--red)}
.intro{display:flex;align-items:center;gap:18px;padding:25px 0 24px}.intro-logo{width:76px;height:76px;object-fit:contain;border-radius:50%}.intro h1{font-size:29px;letter-spacing:-1.1px;margin:0 0 7px}.intro p{font-size:14px;margin:0;color:var(--muted)}.intro .credit{margin-left:auto;text-align:right;line-height:1.7;font-size:12px;color:var(--muted)}
.gallery-meta{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding:16px 0}.count{font-size:12px;color:var(--muted)}
.gallery{columns:5;column-gap:20px}.card{break-inside:avoid;margin:0 0 23px}.photo-button{position:relative;width:100%;display:block;border:0;padding:0;border-radius:19px;overflow:hidden;background:#f1f0ed;text-align:left}.photo-button img{display:block;width:100%;height:auto}.photo-button::after{content:'View photo ↗';position:absolute;bottom:14px;right:14px;color:#222;background:white;border-radius:24px;padding:10px 13px;font-size:12px;font-weight:bold;opacity:0;transform:translateY(5px);transition:.2s}.photo-button:hover::after,.photo-button:focus-visible::after{opacity:1;transform:none}.photo-button:hover img{filter:brightness(.95)}.caption{padding:11px 5px 0}.caption h2{font-size:13px;font-weight:600;line-height:1.4;margin:0 0 4px}.caption p{font-size:11px;margin:0;color:var(--muted)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:25px;text-align:center;color:#777;min-height:200px;background:#f0efeb}.placeholder b{font-size:14px;font-weight:500}.placeholder small{font-size:10px;overflow-wrap:anywhere;line-height:1.6}.placeholder svg{width:29px;height:29px;fill:none;stroke:#aaa;stroke-width:1.2}.empty{padding:70px 20px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted)}
dialog{border:0;border-radius:20px;padding:0;background:#151515;color:white;width:min(1100px,94vw);max-height:94dvh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.85)}.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:12px}.viewer-top p{font-size:12px;color:#ccc;margin:0}.viewer-top button,.viewer-controls button{border:0;border-radius:50%;height:42px;width:42px;background:#303030;color:white;font-size:24px}.viewer-image{width:100%;height:min(70dvh,850px);object-fit:contain;display:block}.viewer-details{padding:18px 24px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.viewer-details h2{font-size:17px;margin:0 0 5px}.viewer-details p{font-size:12px;color:#aaa;margin:0}.viewer-controls{display:flex;gap:8px}.viewer-error{padding:80px 25px;text-align:center;color:#ccc}
@media(min-width:1800px){.gallery{columns:6}}@media(max-width:1250px){.gallery{columns:4}}@media(max-width:1000px){.gallery{columns:3}.shell{padding-inline:22px}.intro .credit{display:none}}@media(max-width:700px){.gallery{columns:2;column-gap:12px}.rail{width:58px;padding:16px 5px;gap:20px}.rail a{width:40px;height:40px}.shell{margin-left:58px;padding-inline:14px}.topbar{padding:12px 0;gap:10px}.back{font-size:11px}.search{padding-inline:13px;height:46px}.search input{font-size:13px}.intro{gap:12px;padding:20px 0}.intro-logo{width:55px;height:55px}.intro h1{font-size:25px}.intro p{font-size:12px}.count{display:none}.photo-button{border-radius:13px}.caption{padding:9px 2px 0}.caption h2{font-size:12px}.placeholder{padding:15px;min-height:150px}.photo-button::after{display:none}footer{flex-direction:column}.card{margin-bottom:18px}}@media(max-width:380px){.back{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Labelled desktop navigation becomes a compact bottom bar on phones. */
.rail{width:100px;gap:15px;padding:20px 6px;overflow-y:auto}.rail .nav-link{width:86px;min-height:62px;height:auto;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:9px 3px}.nav-link span{font-size:10px;font-weight:600;white-space:nowrap}.rail .mark{flex-shrink:0;margin-bottom:12px}.shell{margin-left:100px}.skip{left:110px}.intro h1{margin-bottom:0}.viewer-controls{flex-shrink:0}main{min-height:50vh}footer{padding-bottom:12px}
@media(max-width:700px){
 .rail{inset:auto 0 0;width:100%;flex-direction:row;justify-content:space-around;gap:0;border-right:0;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));overflow:visible;background:#fff}
 .rail .mark{display:none}.rail .nav-link{width:20%;max-width:90px;min-height:56px;border-radius:12px;gap:5px;padding:7px 1px}.rail svg{width:22px;height:22px}.nav-link span{font-size:9px}
 .shell{margin-left:0;padding:0 14px calc(90px + env(safe-area-inset-bottom))}.skip{left:14px}.search input{font-size:16px}.gallery-meta{padding:10px 0 15px}.count{display:inline}.gallery{columns:2;column-gap:12px}.topbar{padding-top:calc(12px + env(safe-area-inset-top))}.viewer-details{padding:16px;gap:12px}.viewer-top button,.viewer-controls button{min-width:44px;min-height:44px}.viewer-image{height:60dvh}footer{text-align:center;align-items:center;justify-content:center}
}
@media(max-width:359px){.gallery{columns:1}.nav-link span{font-size:8px}}
</style>
</head>

<div class="shell">
 <header class="topbar">
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="Search photographs" placeholder="Search photography" autocomplete="off"></label>
  <a class="back" href="index.html">← Phubook</a>
 </header>
 <section class="intro" aria-labelledby="page-title"><img class="intro-logo" src="images/phuterest.jpg" alt="Phuterest logo"><div><h1 id="page-title">Phuterest</h1></div><p class="credit">Photography by Phu<br>A collection of moments, through my lens.</p></section>
 <main id="main">
  <div class="gallery-meta"><span class="count" id="count" aria-live="polite"></span></div>
  <div class="gallery" id="gallery"></div>
  <p class="empty" id="empty" hidden>No photographs found. Try another keyword.</p>
 </main>
 <footer>© 2026 Phuwadech Klinklay</footer>
</div>
<dialog id="viewer" aria-labelledby="viewer-title">
 <div class="viewer-top"><p id="position"></p><button id="close" aria-label="Close photograph" autofocus>×</button></div>
 <img id="viewer-image" class="viewer-image" alt="">
 <p id="viewer-error" class="viewer-error" hidden>This photograph could not be loaded.</p>
 <div class="viewer-details"><div><h2 id="viewer-title"></h2><p id="viewer-caption"></p></div><div class="viewer-controls"><button id="previous" aria-label="Previous photograph">‹</button><button id="next" aria-label="Next photograph">›</button></div></div>
</dialog>
<script>
'use strict';
/* SETUP
   1. Save this page beside your existing index.html as phuterest.html.
   2. Keep your logo at images/phuterest.jpg (case-sensitive).
   3. Replace the SAMPLE entries below with your photographs and descriptions.
      src is the gallery image; full is an optional larger version.
      width/height should match your photo's actual pixel dimensions.
      No external libraries needed.
   4. Add <a href="phuterest.html">Phuterest</a> to your Phubook page.
   Missing files display labelled placeholders, not stock photography.
*/
const photos = [
 {src:'images/photography/photo-01.jpg',title:'Photo 01',alt:'Replace with a description of your first photograph',width:1200,height:1600},
 {src:'images/photography/photo-02.jpg',title:'Photo 02',alt:'Replace with a description of your second photograph',width:1600,height:1100},
 {src:'images/photography/photo-03.jpg',title:'Photo 03',alt:'Replace with a description of your third photograph',width:1200,height:1800},
 {src:'images/photography/photo-04.jpg',title:'Photo 04',alt:'Replace with a description of your fourth photograph',width:1200,height:1500},
 {src:'images/photography/photo-05.jpg',title:'Photo 05',alt:'Replace with a description of your fifth photograph',width:1600,height:1200},
 {src:'images/photography/photo-06.jpg',title:'Photo 06',alt:'Replace with a description of your sixth photograph',width:1200,height:1600},
 {src:'images/photography/photo-07.jpg',title:'Photo 07',alt:'Replace with a description of your seventh photograph',width:1200,height:1500},
 {src:'images/photography/photo-08.jpg',title:'Photo 08',alt:'Replace with a description of your eighth photograph',width:1600,height:1000},
 {src:'images/photography/photo-09.jpg',title:'Photo 09',alt:'Replace with a description of your ninth photograph',width:1200,height:1700},
 {src:'images/photography/photo-10.jpg',title:'Photo 10',alt:'Replace with a description of your tenth photograph',width:1200,height:1500},
 {src:'images/photography/photo-11.jpg',title:'Photo 11',alt:'Replace with a description of your eleventh photograph',width:1600,height:1200},
 {src:'images/photography/photo-12.jpg',title:'Photo 12',alt:'Replace with a description of your twelfth photograph',width:1200,height:1600}
];
const $ = id => document.getElementById(id);
let visible = [], current = 0, opener = null, oldOverflow = '';
const camera = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4l2-3h6l2 3h4v14H3Z"/><circle cx="12" cy="12" r="4"/></svg>';
function render(){
 const query=$('search').value.trim().toLowerCase();
 visible=photos.filter(p=>[p.title,p.alt,p.location||''].join(' ').toLowerCase().includes(query));
 $('gallery').replaceChildren();$('count').textContent=visible.length+' photograph'+(visible.length===1?'':'s');$('empty').hidden=visible.length>0;
 visible.forEach((photo,index)=>{
  const card=document.createElement('article');card.className='card';
  const button=document.createElement('button');button.className='photo-button';button.type='button';button.setAttribute('aria-label','View '+photo.title);
  const img=document.createElement('img');img.alt=photo.alt;img.width=photo.width;img.height=photo.height;img.loading=index<6?'eager':'lazy';img.decoding='async';
  img.addEventListener('error',()=>{img.hidden=true;const placeholder=document.createElement('span');placeholder.className='placeholder';placeholder.style.aspectRatio=photo.width+'/'+photo.height;placeholder.innerHTML=camera;const label=document.createElement('b');label.textContent='Add your photograph';const path=document.createElement('small');path.textContent=photo.src;placeholder.append(label,path);button.append(placeholder);},{once:true});
  img.src=photo.src;button.append(img);button.addEventListener('click',()=>{current=index;opener=button;showPhoto();oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';$('viewer').showModal();});
  const caption=document.createElement('div');caption.className='caption';const title=document.createElement('h2');title.textContent=photo.title;caption.append(title);card.append(button,caption);$('gallery').append(card);
 });
}
function showPhoto(){
 const photo=visible[current];if(!photo)return;
 const img=$('viewer-image');img.hidden=false;$('viewer-error').hidden=true;img.alt=photo.alt;img.src=photo.full||photo.src;
 $('viewer-title').textContent=photo.title;$('viewer-caption').textContent=photo.location||'';$('position').textContent=(current+1)+' / '+visible.length;
 $('previous').disabled=$('next').disabled=visible.length<2;
}
function step(direction){current=(current+direction+visible.length)%visible.length;showPhoto();}
$('viewer-image').addEventListener('error',()=>{$('viewer-image').hidden=true;$('viewer-error').hidden=false;});
$('search').addEventListener('input',render);
$('close').addEventListener('click',()=>$('viewer').close());
$('previous').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
$('viewer').addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}if(event.key==='ArrowRight'){event.preventDefault();step(1);}});
$('viewer').addEventListener('click',event=>{if(event.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('viewer').close();}});
$('viewer').addEventListener('close',()=>{document.body.style.overflow=oldOverflow;opener?.focus();});
document.querySelectorAll('img[src="images/phuterest.jpg"]').forEach(img=>{const fallback=()=>{img.hidden=true;if(img.nextElementSibling?.classList.contains('monogram'))img.nextElementSibling.hidden=false;};img.addEventListener('error',fallback);if(img.complete&&img.naturalWidth===0)fallback();});
render();
</script>
