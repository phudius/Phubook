<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phuterest · Photography by Phu</title>
<meta name="description" content="A photography portfolio by Phu.">
<link rel="icon" href="images/phuterest.jpg">

<style>
:root {
  --ink: #202020;
  --muted: #737373;
  --red: #bd142a;
  --line: #e9e9e9;
  --paper: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
a {
  -webkit-tap-highlight-color: transparent;
}

button,
input {
  font: inherit;
}

button,
a {
  touch-action: manipulation;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid var(--red);
  outline-offset: 4px;
}

[hidden] {
  display: none !important;
}

.skip {
  position: fixed;
  top: -80px;
  left: 110px;
  z-index: 20;
  padding: 15px;
  background: white;
}

.skip:focus {
  top: 10px;
}

/* Desktop sidebar */

.rail {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  width: 100px;
  padding: 20px 6px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: white;
}

.rail a {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 16px;
}

.rail a:hover {
  background: #f1f1f1;
}

.rail .mark {
  flex-shrink: 0;
  margin-bottom: 12px;
  padding: 3px;
}

.mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

.monogram {
  color: var(--red);
  font-size: 25px;
  font-weight: bold;
}

.rail .nav-link {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex-shrink: 0;
  gap: 7px;
  width: 86px;
  height: auto;
  min-height: 62px;
  padding: 9px 3px;
}

.nav-link span {
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}

.rail svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.rail .active {
  background: #f1f1f1;
}

/* Main layout */

.shell {
  margin-left: 100px;
  padding: 0 30px 35px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 0;
  background: rgba(255, 255, 255, 0.97);
}

.search {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 12px;
  min-width: 0;
  height: 54px;
  padding: 0 20px;
  border-radius: 30px;
  background: #f0f0ee;
}

.search svg {
  width: 20px;
  min-width: 20px;
  fill: none;
  stroke: #656560;
  stroke-width: 1.7;
}

.search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
}

.search:focus-within {
  box-shadow: 0 0 0 3px #e1b4bb;
}

.search input:focus-visible {
  outline: 0;
}

.back {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.back:hover {
  color: var(--red);
}

/* Page heading */

.intro {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 25px 0 24px;
}

.intro-logo {
  width: 76px;
  height: 76px;
  object-fit: contain;
  border-radius: 50%;
}

.intro h1 {
  margin: 0;
  font-size: 29px;
  letter-spacing: -1.1px;
}

.intro .credit {
  margin: 0 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  text-align: right;
}

main {
  min-height: 50vh;
}

.gallery-meta {
  display: flex;
  justify-content: flex-end;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.count {
  color: var(--muted);
  font-size: 12px;
}

/* Masonry photography gallery */

.gallery {
  columns: 5;
  column-gap: 20px;
}

.card {
  break-inside: avoid;
  margin: 0 0 23px;
}

.photo-button {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 19px;
  background: #f1f0ed;
  text-align: left;
}

.photo-button img {
  display: block;
  width: 100%;
  height: auto;
}

.photo-button::after {
  content: "View photo ↗";
  position: absolute;
  right: 14px;
  bottom: 14px;
  padding: 10px 13px;
  border-radius: 24px;
  background: white;
  color: #222;
  font-size: 12px;
  font-weight: bold;
  opacity: 0;
  transform: translateY(5px);
  transition: 0.2s;
}

.photo-button:hover::after,
.photo-button:focus-visible::after {
  opacity: 1;
  transform: none;
}

.photo-button:hover img {
  filter: brightness(0.95);
}

.caption {
  padding: 11px 5px 0;
}

.caption h2 {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}

/* Missing-image state */

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 200px;
  padding: 25px;
  background: #f0efeb;
  color: #777;
  text-align: center;
}

.placeholder b {
  font-size: 14px;
  font-weight: 500;
}

.placeholder small {
  font-size: 10px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.placeholder svg {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: #aaa;
  stroke-width: 1.2;
}

.empty {
  padding: 70px 20px;
  color: var(--muted);
  text-align: center;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 0 12px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
}

/* Full-size photograph viewer */

dialog {
  width: min(1100px, 94vw);
  max-height: 94dvh;
  padding: 0;
  overflow: auto;
  border: 0;
  border-radius: 20px;
  background: #151515;
  color: white;
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.85);
}

.viewer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
}

.viewer-top p {
  margin: 0;
  color: #ccc;
  font-size: 12px;
}

.viewer-top button,
.viewer-controls button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #303030;
  color: white;
  font-size: 24px;
}

.viewer-image {
  display: block;
  width: 100%;
  height: min(70dvh, 850px);
  object-fit: contain;
}

.viewer-details {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 24px 22px;
}

.viewer-details h2 {
  margin: 0 0 5px;
  font-size: 17px;
}

.viewer-details p {
  margin: 0;
  color: #aaa;
  font-size: 12px;
}

.viewer-controls {
  display: flex;
  flex-shrink: 0;
  gap: 8px;
}

.viewer-error {
  padding: 80px 25px;
  color: #ccc;
  text-align: center;
}

/* Responsive layouts */

@media (min-width: 1800px) {
  .gallery {
    columns: 6;
  }
}

@media (max-width: 1250px) {
  .gallery {
    columns: 4;
  }
}

@media (max-width: 1000px) {
  .gallery {
    columns: 3;
  }

  .shell {
    padding-inline: 22px;
  }

  .intro .credit {
    display: none;
  }
}

@media (max-width: 700px) {
  /* Sidebar becomes bottom navigation on mobile. */

  .rail {
    inset: auto 0 0;
    flex-direction: row;
    justify-content: space-around;
    gap: 0;
    width: 100%;
    padding: 5px 4px calc(5px + env(safe-area-inset-bottom));
    overflow: visible;
    border-top: 1px solid var(--line);
    border-right: 0;
    background: #fff;
  }

  .rail .mark {
    display: none;
  }

  .rail .nav-link {
    gap: 5px;
    width: 20%;
    max-width: 90px;
    min-height: 56px;
    padding: 7px 1px;
    border-radius: 12px;
  }

  .rail svg {
    width: 22px;
    height: 22px;
  }

  .nav-link span {
    font-size: 9px;
  }

  .shell {
    margin-left: 0;
    padding: 0 14px calc(90px + env(safe-area-inset-bottom));
  }

  .skip {
    left: 14px;
  }

  .topbar {
    gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 0 12px;
  }

  .back {
    font-size: 11px;
  }

  .search {
    height: 46px;
    padding-inline: 13px;
  }

  .search input {
    font-size: 16px;
  }

  .intro {
    gap: 12px;
    padding: 20px 0;
  }

  .intro-logo {
    width: 55px;
    height: 55px;
  }

  .intro h1 {
    font-size: 25px;
  }

  .gallery-meta {
    padding: 10px 0 15px;
  }

  .gallery {
    columns: 2;
    column-gap: 12px;
  }

  .card {
    margin-bottom: 18px;
  }

  .photo-button {
    border-radius: 13px;
  }

  .photo-button::after {
    display: none;
  }

  .caption {
    padding: 9px 2px 0;
  }

  .caption h2 {
    font-size: 12px;
  }

  .placeholder {
    min-height: 150px;
    padding: 15px;
  }

  .viewer-details {
    gap: 12px;
    padding: 16px;
  }

  .viewer-top button,
  .viewer-controls button {
    min-width: 44px;
    min-height: 44px;
  }

  .viewer-image {
    height: 60dvh;
  }

  footer {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
}

@media (max-width: 380px) {
  .back {
    display: none;
  }
}

@media (max-width: 359px) {
  .gallery {
    columns: 1;
  }

  .nav-link span {
    font-size: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<a class="skip" href="#main">Skip to photographs</a>

<nav class="rail" aria-label="Portfolio pages">

  <a class="mark" href="phuterest.html" aria-label="Phuterest home">
    <img src="images/phuterest.jpg" alt="">
    <span class="monogram" hidden>P</span>
  </a>

  <a class="nav-link" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/>
    </svg>
    <span>Phubook</span>
  </a>

  <a class="nav-link" href="phustagram.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <path d="M17 7h.01"/>
    </svg>
    <span>Phustagram</span>
  </a>

  <a class="nav-link" href="phutube.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="5" width="20" height="14" rx="4"/>
      <path d="m10 9 5 3-5 3Z"/>
    </svg>
    <span>PhuTube</span>
  </a>

  <a class="nav-link" href="phugleads.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20V12M12 20V4M20 20V8"/>
    </svg>
    <span>Phugle Ads</span>
  </a>

  <a
    class="nav-link active"
    href="phuterest.html"
    aria-current="page"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M10 3v18M10 12h11"/>
    </svg>
    <span>Phuterest</span>
  </a>

</nav>

<div class="shell">

  <header class="topbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7.5"/>
        <path d="m16 16 5 5"/>
      </svg>

      <input
        id="search"
        type="search"
        aria-label="Search photographs"
        placeholder="Search photography"
        autocomplete="off"
      >
    </label>

    <a class="back" href="index.html">← Phubook</a>
  </header>

  <section class="intro" aria-labelledby="page-title">
    <img
      class="intro-logo"
      src="images/phuterest.jpg"
      alt="Phuterest logo"
    >

    <div>
      <h1 id="page-title">Phuterest</h1>
    </div>

    <p class="credit">
      Photography by Phu<br>
      A collection of moments, through my lens.
    </p>
  </section>

  <main id="main">
    <div class="gallery-meta">
      <span class="count" id="count" aria-live="polite"></span>
    </div>

    <div class="gallery" id="gallery"></div>

    <p class="empty" id="empty" hidden>
      No photographs found. Try another keyword.
    </p>
  </main>

  <footer>© 2026 Phuwadech Klinklay</footer>

</div>

<dialog id="viewer" aria-labelledby="viewer-title">

  <div class="viewer-top">
    <p id="position"></p>

    <button
      id="close"
      aria-label="Close photograph"
      autofocus
    >×</button>
  </div>

  <img id="viewer-image" class="viewer-image" alt="">

  <p id="viewer-error" class="viewer-error" hidden>
    This photograph could not be loaded.
  </p>

  <div class="viewer-details">
    <div>
      <h2 id="viewer-title"></h2>
      <p id="viewer-caption"></p>
    </div>

    <div class="viewer-controls">
      <button id="previous" aria-label="Previous photograph">‹</button>
      <button id="next" aria-label="Next photograph">›</button>
    </div>
  </div>

</dialog>

<script>
'use strict';

/*
  PHOTO SETTINGS

  Your logo:
  images/phuterest.jpg

  Your photographs:
  images/ptr1.jpg through images/ptr11.jpg

  Change the titles and alt descriptions below as needed.
  Photos retain their original proportions.

  Optional properties:
  location: 'Phuket'
  full: 'images/larger-version.jpg'
*/

const photos = [
  {
    src: 'images/ptr1.jpg',
    title: 'Photo 01',
    alt: 'Photography by Phuwadech Klinklay — photo 1'
  },
  {
    src: 'images/ptr2.jpg',
    title: 'Photo 02',
    alt: 'Photography by Phuwadech Klinklay — photo 2'
  },
  {
    src: 'images/ptr3.jpg',
    title: 'Photo 03',
    alt: 'Photography by Phuwadech Klinklay — photo 3'
  },
  {
    src: 'images/ptr4.jpg',
    title: 'Photo 04',
    alt: 'Photography by Phuwadech Klinklay — photo 4'
  },
  {
    src: 'images/ptr5.jpg',
    title: 'Photo 05',
    alt: 'Photography by Phuwadech Klinklay — photo 5'
  },
  {
    src: 'images/ptr6.jpg',
    title: 'Photo 06',
    alt: 'Photography by Phuwadech Klinklay — photo 6'
  },
  {
    src: 'images/ptr7.jpg',
    title: 'Photo 07',
    alt: 'Photography by Phuwadech Klinklay — photo 7'
  },
  {
    src: 'images/ptr8.jpg',
    title: 'Photo 08',
    alt: 'Photography by Phuwadech Klinklay — photo 8'
  },
  {
    src: 'images/ptr9.jpg',
    title: 'Photo 09',
    alt: 'Photography by Phuwadech Klinklay — photo 9'
  },
  {
    src: 'images/ptr10.jpg',
    title: 'Photo 10',
    alt: 'Photography by Phuwadech Klinklay — photo 10'
  },
  {
    src: 'images/ptr11.jpg',
    title: 'Photo 11',
    alt: 'Photography by Phuwadech Klinklay — photo 11'
  }
];

const $ = id => document.getElementById(id);

let visible = [];
let current = 0;
let opener = null;
let oldOverflow = '';

const camera = `
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 6h4l2-3h6l2 3h4v14H3Z"/>
    <circle cx="12" cy="12" r="4"/>
  </svg>
`;

function render() {
  const query = $('search').value.trim().toLowerCase();

  visible = photos.filter(photo => {
    const text = [
      photo.title,
      photo.alt,
      photo.location || ''
    ].join(' ').toLowerCase();

    return text.includes(query);
  });

  $('gallery').replaceChildren();

  $('count').textContent =
    visible.length +
    ' photograph' +
    (visible.length === 1 ? '' : 's');

  $('empty').hidden = visible.length > 0;

  visible.forEach((photo, index) => {
    const card = document.createElement('article');
    card.className = 'card';

    const button = document.createElement('button');
    button.className = 'photo-button';
    button.type = 'button';
    button.setAttribute('aria-label', 'View ' + photo.title);

    const img = document.createElement('img');
    img.alt = photo.alt;

    if (photo.width && photo.height) {
      img.width = photo.width;
      img.height = photo.height;
    }

    img.loading = index < 6 ? 'eager' : 'lazy';
    img.decoding = 'async';

    img.addEventListener('error', () => {
      img.hidden = true;

      const placeholder = document.createElement('span');
      placeholder.className = 'placeholder';

      placeholder.style.aspectRatio =
        photo.width && photo.height
          ? photo.width + '/' + photo.height
          : '3/4';

      placeholder.innerHTML = camera;

      const label = document.createElement('b');
      label.textContent = 'Add your photograph';

      const path = document.createElement('small');
      path.textContent = photo.src;

      placeholder.append(label, path);
      button.append(placeholder);
    }, { once: true });

    img.src = photo.src;
    button.append(img);

    button.addEventListener('click', () => {
      current = index;
      opener = button;

      showPhoto();

      oldOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';

      $('viewer').showModal();
    });

    const caption = document.createElement('div');
    caption.className = 'caption';

    const title = document.createElement('h2');
    title.textContent = photo.title;

    caption.append(title);
    card.append(button, caption);
    $('gallery').append(card);
  });
}

function showPhoto() {
  const photo = visible[current];

  if (!photo) return;

  const img = $('viewer-image');

  img.hidden = false;
  $('viewer-error').hidden = true;

  img.alt = photo.alt;
  img.src = photo.full || photo.src;

  $('viewer-title').textContent = photo.title;
  $('viewer-caption').textContent = photo.location || '';

  $('position').textContent =
    (current + 1) + ' / ' + visible.length;

  $('previous').disabled = visible.length < 2;
  $('next').disabled = visible.length < 2;
}

function step(direction) {
  current =
    (current + direction + visible.length) % visible.length;

  showPhoto();
}

$('viewer-image').addEventListener('error', () => {
  $('viewer-image').hidden = true;
  $('viewer-error').hidden = false;
});

$('search').addEventListener('input', render);

$('close').addEventListener('click', () => {
  $('viewer').close();
});

$('previous').addEventListener('click', () => {
  step(-1);
});

$('next').addEventListener('click', () => {
  step(1);
});

$('viewer').addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    step(-1);
  }

  if (event.key === 'ArrowRight') {
    event.preventDefault();
    step(1);
  }
});

/* Close when clicking outside the dialog. */

$('viewer').addEventListener('click', event => {
  if (event.target !== $('viewer')) return;

  const rect = $('viewer').getBoundingClientRect();

  const outside =
    event.clientX < rect.left ||
    event.clientX > rect.right ||
    event.clientY < rect.top ||
    event.clientY > rect.bottom;

  if (outside) {
    $('viewer').close();
  }
});

$('viewer').addEventListener('close', () => {
  document.body.style.overflow = oldOverflow;
  opener?.focus();
});

/* Logo fallback if the logo file is unavailable. */

document
  .querySelectorAll('img[src="images/phuterest.jpg"]')
  .forEach(img => {
    const fallback = () => {
      img.hidden = true;

      if (
        img.nextElementSibling?.classList.contains('monogram')
      ) {
        img.nextElementSibling.hidden = false;
      }
    };

    img.addEventListener('error', fallback);

    if (img.complete && img.naturalWidth === 0) {
      fallback();
    }
  });

render();
</script>

</body>
</html>
